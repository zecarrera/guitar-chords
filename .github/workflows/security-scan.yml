name: "Security Scan"

# Detects new high/critical dependency vulnerabilities and vulnerable code
# patterns on pull requests and pushes to main. See:
# openspec/changes/add-dependency-vulnerability-scanning/proposal.md

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit (high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit (fail on high or critical)
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
