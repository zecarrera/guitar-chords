name: "Temp: Apply npm audit fix"

# Temporary, manually-triggered workflow used to apply npm audit fix on this
# branch since npm cannot be executed in the authoring sandbox. Deleted after
# use. See openspec/changes/add-dependency-vulnerability-scanning.

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run npm audit fix --force (allows breaking upgrades)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run npm audit fix (safe)
        run: npm audit fix || true

      - name: Run npm audit fix --force
        if: ${{ inputs.force }}
        run: npm audit fix --force || true

      - name: Regenerate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Show remaining audit report
        run: npm audit || true

      - name: Commit changes if any
        run: |
          if [ -n "$(git status --porcelain package.json package-lock.json)" ]; then
            git add package.json package-lock.json
            git commit -m "chore: apply npm audit fix (automated)"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes to commit"
          fi
