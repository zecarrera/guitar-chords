version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # react and react-dom must stay on matching versions (react-dom's peer
      # dependency requires an exact-matching react version), so bump them
      # together to avoid a broken intermediate state across split PRs.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
