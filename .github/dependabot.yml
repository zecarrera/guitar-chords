version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # react and react-dom must stay on matching versions (react-dom's peer
      # dependency requires an exact-matching react version), so bump them
      # together to avoid a broken intermediate state across split PRs.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # prisma and @prisma/client are the CLI/runtime pair for the same
      # generated client and must be upgraded together to avoid schema/client
      # version mismatches across split PRs.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/client"
